name: a2z_healthconnect
description: "A2Z HealthConnect - AI-powered multilingual telemedicine app for rural India"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management — lightweight, ideal for low-end devices
  provider: ^6.1.1

  # Offline local storage
  shared_preferences: ^2.2.2

  # Network status detection
  connectivity_plus: ^5.0.2

  # HTTP client for API calls
  http: ^1.2.0

  # Modern accessible typography
  google_fonts: ^6.1.0

  # Internationalization utilities
  intl: ^0.20.2

  # Onboarding page indicator
  smooth_page_indicator: ^1.1.0

  # Loading shimmer effect (perceived performance)
  shimmer: ^3.0.0

  # Local database for offline sync
  sqflite: ^2.4.2+1
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

# Fix: objective_c native hook fails with spaces in Windows path
# (C:\Users\Khatijatul Kubra\...). Override to an older version that doesn't use it.
dependency_overrides:
  path_provider_foundation: 2.3.2

flutter:
  generate: true
  uses-material-design: true

  # Asset directories — add actual assets here later
  # assets:
  #   - assets/images/
  #   - assets/icons/

