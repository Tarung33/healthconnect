name: a2z_healthconnect
description: "A2Z HealthConnect - AI-powered multilingual telemedicine app for rural India"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management — lightweight, ideal for low-end devices
  provider: ^6.1.1

  # Offline local storage
  shared_preferences: ^2.2.2

  # Network status detection
  connectivity_plus: ^5.0.2

  # HTTP client for API calls
  http: ^1.2.0

  # Modern accessible typography
  google_fonts: ^6.1.0

  # Internationalization utilities
  intl: ^0.19.0

  # Onboarding page indicator
  smooth_page_indicator: ^1.1.0

  # Loading shimmer effect (perceived performance)
  shimmer: ^3.0.0

  # Cached images for offline support
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  # Asset directories — add actual assets here later
  # assets:
  #   - assets/images/
  #   - assets/icons/
